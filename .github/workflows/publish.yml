name: publish

# Publishes to PyPI through Trusted Publishing (OIDC).
# No API token is stored anywhere: GitHub mints a short-lived OIDC token,
# PyPI verifies this repository + workflow + environment, then accepts the
# upload. Revoke any long-lived token once this has run once successfully.
#
# PyPI side (must exist before the first run):
#   https://pypi.org/manage/project/ziban/settings/publishing/
#   publisher: GitHub
#   owner:       smhchylxr-cloud
#   repository:  ziban
#   workflow:    publish.yml
#   environment: pypi

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build and verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest -q

      - name: Build
        run: python -m build

      - name: Check the metadata will render on PyPI
        run: python -m twine check dist/*

      - name: Decide whether this version still needs publishing
        id: guard
        run: |
          set -euo pipefail
          version=$(python -c "import ziban; print(ziban.__version__)")
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/ziban/${version}/json")
          echo "version: $version (PyPI says $code)"
          if [ "$code" = "200" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ziban ${version} is already on PyPI — nothing to publish."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

    outputs:
      publish: ${{ steps.guard.outputs.publish }}

  publish:
    name: publish to PyPI
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # the OIDC token PyPI checks
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
